<article class="tarjeta">

  <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round preview-icon"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
  
  <div>
      <p class="nombre">{{ user().name }} - {{ user().id }}</p>
      <p class="extra">{{ user().correo }}</p>
      <p class="extra">{{ user().ciudad }}</p>
  </div>
  
  <div class="lateral">
      <p>Favorito</p>
      <button
        type="button"
        class="boton-favorito"
        [class.activo]="user().isFav"
        [attr.aria-label]="user().isFav ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        [attr.aria-pressed]="user().isFav"
        (click)="favToggled.emit(user().id)"
      ></button>
  </div>
  
</article>
